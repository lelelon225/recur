spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/recur}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=data
server.port=8080
server.forward-headers-strategy=framework

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

app.oauth2.redirect-path=/oauth/success

app.mail.brevo-api-key=${BREVO_API_KEY:}

app.mail.from=${MAIL_FROM:noreply@recur.app}
app.mail.verification-expiry-hours=${MAIL_VERIFICATION_EXPIRY_HOURS:24}
app.mail.resend-cooldown-seconds=${MAIL_RESEND_COOLDOWN_SECONDS:60}
app.mail.password-reset-expiry-hours=${MAIL_PASSWORD_RESET_EXPIRY_HOURS:1}
app.mail.password-reset-cooldown-seconds=${MAIL_PASSWORD_RESET_COOLDOWN_SECONDS:60}

app.frontend.url=${FRONTEND_URL:http://localhost:3000}

app.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.push.vapid-subject=${VAPID_SUBJECT:mailto:noreply@recur.app}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}