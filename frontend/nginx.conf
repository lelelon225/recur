worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Server block is generated at container start from
    # templates/default.conf.template (envsubst fills in ${BACKEND_HOST}),
    # via the base nginx image's docker-entrypoint.d scripts.
    include /etc/nginx/conf.d/*.conf;
}
