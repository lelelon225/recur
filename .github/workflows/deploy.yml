# .github/workflows/deploy.yml
name: build-and-deploy
on:
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch: {}

# GITHUB_TOKEN needs explicit packages:write, or GHCR push fails on repos
# where default token permissions are read-only.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set tag
        id: tag
        run: |
          # deploy-prod/deploy-dev always pull a fixed tag (":latest"/":dev")
          # from compose.yml, so every build also pushes that moving tag
          # alongside the immutable one (the git tag for prod releases).
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "moving_tag=latest" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "moving_tag=dev" >> $GITHUB_OUTPUT
          fi

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/rem1706/recur-backend:${{ steps.tag.outputs.tag }}
            ghcr.io/rem1706/recur-backend:${{ steps.tag.outputs.moving_tag }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/rem1706/recur-frontend:${{ steps.tag.outputs.tag }}
            ghcr.io/rem1706/recur-frontend:${{ steps.tag.outputs.moving_tag }}

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, homelab]
    steps:
      # GHCR packages are private by default - the build job's login only
      # covers its own (github-hosted) docker daemon, so this runner needs
      # its own login before it can pull.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose -f /opt/recur/compose.yml pull backend-dev frontend-dev
      - run: docker compose -f /opt/recur/compose.yml up -d backend-dev frontend-dev

  deploy-prod:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, homelab]
    environment: production # requires manual approval, see below
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose -f /opt/recur/compose.yml pull backend-prod frontend-prod
      - run: docker compose -f /opt/recur/compose.yml up -d backend-prod frontend-prod
